<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rockman DASH: Great Adventure on 5 Islands</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { height: 100%; margin: 0; background: #0b0d12; color: #d7dce5;
      font: 15px/1.4 system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    #menu { text-align: center; max-width: 34rem; padding: 1rem; }
    #menu h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    #menu p { color: #8b93a3; margin: .25rem 0 1.25rem; }
    #menu button { font: inherit; margin: .3rem; padding: .7rem 1.1rem; border-radius: .5rem;
      border: 1px solid #2f3747; background: #171c27; color: inherit; cursor: pointer; }
    #menu button:hover { background: #222a3a; }
    #menu small { display: block; color: #8b93a3; }
    #stage { display: flex; flex-direction: column; align-items: center; }
    #stage { --aspect: 1; }
    #screen { display: block; height: min(calc(100vw / var(--aspect)), calc(100vh - 9.4rem)); aspect-ratio: var(--aspect);
      background: #000; }
    #screen.pixelated { image-rendering: pixelated; }
    #soft { display: flex; justify-content: space-between; width: min(100vw, calc(100vh - 7.5rem));
      box-sizing: border-box; padding: .35rem .75rem; color: #aab2c2; min-height: 1.4rem; }
    #bar { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; margin: .15rem 0 .35rem; }
    #bar button { font: inherit; font-size: .8rem; padding: .25rem .6rem; border-radius: .4rem;
      border: 1px solid #2f3747; background: #171c27; color: #aab2c2; cursor: pointer; }
    #bar button:hover { background: #222a3a; }
    #stage:fullscreen { background: #000; justify-content: center; height: 100%; }
    #stage:fullscreen #screen { height: min(calc(100vw / var(--aspect)), calc(100vh - 3rem)); }
    #stage:fullscreen #bar, #stage:fullscreen #pad { display: none; }
    #bar button.on { border-color: #b08a2e; color: #e6c15a; }
    #pad { color: #5f6779; font-size: .8rem; }
    #pad.on { color: #7fc28a; }
    #stage { position: relative; }
    #settings { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center;
      justify-content: center; background: rgba(5, 7, 11, .6); }
    #settings .panel { width: min(46rem, calc(100vw - 1rem)); max-height: calc(100% - 1rem); display: flex;
      flex-direction: column; background: #11151e; border: 1px solid #2f3747; border-radius: .7rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, .6); outline: none; font-size: .9rem; }
    #settings .tabs { display: flex; gap: .2rem; padding: .5rem .6rem 0; border-bottom: 1px solid #2f3747; }
    #settings button, #settings select { font: inherit; color: #c5ccd9; background: #171c27;
      border: 1px solid #2f3747; border-radius: .4rem; padding: .25rem .6rem; cursor: pointer; }
    #settings button:hover { background: #222a3a; }
    #settings .tab { border-bottom: none; border-radius: .4rem .4rem 0 0; padding: .4rem .9rem; color: #8b93a3; }
    #settings .tab.on { background: #222a3a; color: #e6c15a; }
    #settings .close { margin-left: auto; border: none; background: none; font-size: 1.2rem; }
    #settings .body { padding: .7rem 1rem; overflow-y: auto; }
    #settings .row { display: grid; grid-template-columns: 13rem 12rem 1fr; gap: .2rem .8rem; align-items: center;
      padding: .3rem 0; }
    #settings .row input[type=checkbox] { justify-self: start; width: 1.1rem; height: 1.1rem; }
    #settings .row small, #settings .note { color: #6f7889; font-size: .8rem; }
    #settings .slider { display: flex; align-items: center; gap: .5rem; }
    #settings .slider input { flex: 1; min-width: 0; }
    #settings .value { width: 2.6rem; text-align: right; color: #8b93a3; font-size: .8rem; }
    #settings .buttons { display: flex; gap: .5rem; flex-wrap: wrap; margin: .6rem 0 .2rem; }
    #settings .danger { border-color: #6b2f37; color: #e08a94; }
    #settings .pad { color: #6f7889; margin: 0 0 .3rem; }
    #settings .pad.on { color: #7fc28a; }
    #settings .binds { width: 100%; border-collapse: collapse; margin-top: .4rem; }
    #settings .binds th { text-align: left; color: #6f7889; font-weight: 500; }
    #settings .binds th, #settings .binds td { padding: .18rem .5rem .18rem 0; border-bottom: 1px solid #1c2230; }
    #settings .chip { display: inline-flex; align-items: center; gap: .15rem; margin: .1rem .25rem .1rem 0;
      padding: 0 0 0 .45rem; border: 1px solid #2f3747; border-radius: .4rem; background: #171c27; }
    #settings .chip .x { border: none; background: none; padding: 0 .35rem; color: #6f7889; }
    #settings .add { padding: 0 .45rem; color: #8b93a3; }
    #settings .add.listening { color: #e6c15a; border-color: #b08a2e; }
    #settings .foot { padding: .45rem 1rem; border-top: 1px solid #2f3747; color: #6f7889; font-size: .8rem; }
    #help { color: #5f6779; font-size: .8rem; text-align: center; }
    #touch { display: none; width: min(100vw, 30rem); box-sizing: border-box; padding: .5rem .75rem;
      justify-content: space-between; align-items: center; touch-action: none; user-select: none;
      -webkit-user-select: none; }
    body.touch #touch { display: flex; }
    body.touch #screen { height: min(calc(100vw / var(--aspect)), calc(100vh - 17rem)); }
    #touch .pad { display: grid; grid-template-columns: repeat(3, 3.4rem); grid-template-rows: repeat(3, 3.4rem);
      gap: .25rem; }
    #touch button { font: 600 .8rem system-ui, sans-serif; border-radius: .7rem; border: 1px solid #2f3747;
      background: #171c27; color: #d7dce5; touch-action: none; }
    #touch button.down, #touch button.on { background: #33405a; }
    #touch .mid { display: flex; flex-direction: column; gap: .4rem; }
    #touch .mid button { padding: .5rem .6rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Rockman DASH: Great Adventure on 5 Islands</h1>
    <p>Choose which English names to use.</p>
    <button data-variant="localized">Localized<small>MegaMan, Servbot, Reaverbot, Digger</small></button>
    <button data-variant="delocalized">Delocalized<small>Rock, Kobun, Reaverd, Digouter</small></button>
  </div>
  <div id="status" hidden></div>
  <div id="stage" hidden>
    <canvas id="screen" width="240" height="240"></canvas>
    <div id="soft"><span id="soft1"></span><span id="soft2"></span></div>
    <div id="bar">
      <button id="btn-settings" title="F1">Settings</button>
      <button id="btn-fast" title="Click to switch on or off; or hold Tab / L3">Fast-forward ▶▶</button>
      <button id="btn-wide" title="F3">Widescreen</button>
      <button id="btn-mute" title="M">Mute</button>
      <button id="btn-full" title="F">Fullscreen</button>
    </div>
    <div id="pad"></div>
    <div id="settings" hidden></div>
    <div id="touch">
      <div class="pad">
        <span></span><button data-key="17">▲</button><span></span>
        <button data-key="16">◀</button><button data-key="20">OK</button><button data-key="18">▶</button>
        <span></span><button data-key="19">▼</button><span></span>
      </div>
      <div class="mid">
        <button data-key="21">Soft 1</button>
        <button data-key="22">Soft 2</button>
        <button id="touch-fast">▶▶</button>
      </div>
      <div class="pad">
        <span></span><button data-key="6">Special</button><span></span>
        <button data-key="9">Buster</button><span></span><button data-key="3">Lock</button>
        <span></span><button data-key="0">Jump</button><span></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
